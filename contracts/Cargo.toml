[workspace]
resolver = "2"
members = [
    "voter-registry",
    "poll",
    "poll-factory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "27.0.2"

[profile.release]
opt-level = "z"
lto = true
debug = false
strip = true
codegen-units = 1
panic = "abort"

[profile.release-with-logs]
inherits = "release"
debug = true
strip = false
